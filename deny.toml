# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
ignore = [
  # fast-float: empty-input segfault in unsafe pointer deref. Pulled in
  # transitively by polars-arrow -> polars (tikr-backtest replay only).
  # No safe upgrade -- fix lives in the fast-float2 fork; polars has not
  # migrated yet. We never feed untrusted strings to polars's float parser
  # (recorder writes from typed WS payloads, replay reads our own files),
  # so the empty-string path is unreachable. Revisit on polars bump.
  { id = "RUSTSEC-2025-0003", reason = "transitive via polars; empty-input path unreachable from our usage" },
  # paste: crate archived by dtolnay; no functional vulnerabilities reported.
  # Pulled transitively by alloy-primitives (via alloy-signer-local, new in
  # Phase 5). The paste macro is a proc-macro used at compile time only; no
  # runtime exposure. Revisit when alloy-primitives drops the dependency.
  { id = "RUSTSEC-2024-0436", reason = "transitive via alloy-primitives; compile-time proc-macro only, no runtime exposure" },
  # proc-macro-error2: fork of proc-macro-error, now also unmaintained. Pulled
  # in transitively by polars (-> polars-error). Compile-time proc-macro only;
  # no runtime exposure. No safe upgrade until polars drops it. Revisit on
  # polars bump.
  { id = "RUSTSEC-2026-0173", reason = "transitive via polars; compile-time proc-macro only, no runtime exposure" },
  # zstd / zstd-safe: fixed only in zstd 0.14.3 and zstd-safe 8.2.0, but
  # polars-parquet (0.43 and the latest 0.55) requires zstd ^0.13. It builds
  # zstd with default features off, so neither `legacy` (0403) nor `seekable`
  # (0398) is compiled in, and it only calls the bulk compressor and
  # `zstd::Decoder::new` (the read decoder), never the `with_context`
  # constructors (0391). Revisit on polars bump.
  { id = "RUSTSEC-2026-0391", reason = "transitive via polars-parquet; with_context constructors never called" },
  { id = "RUSTSEC-2026-0398", reason = "transitive via polars-parquet; seekable feature not enabled" },
  { id = "RUSTSEC-2026-0403", reason = "transitive via polars-parquet; legacy feature not enabled" },
  # crypto-bigint 0.5: timing variability in operations meant to be
  # constant-time; fixed only in 0.7.6. Reached through elliptic-curve 0.13,
  # which alloy-signer (2.0 and the latest 2.5) still requires via k256 0.13,
  # so the Hyperliquid signer has no fixed version to move to. Not analysed
  # which of the affected operations k256 signing reaches. Revisit when alloy
  # moves to k256 0.14.
  { id = "RUSTSEC-2026-0387", reason = "transitive via alloy-signer; no alloy release off crypto-bigint 0.5 yet" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  # Boost Software License -- OSI-approved, FSF Free/Libre. Pulled in by
  # xxhash-rust (transitive via polars-core).
  "BSL-1.0",
  # The Unlicense -- public domain dedication. OSI-approved, FSF Free/Libre.
  # Pulled in by async_io_stream + pharos + ws_stream_wasm (transitive via
  # alloy-provider ws feature, new in tikr-dodo Phase 5).
  "Unlicense",
  # Community Data License Agreement -- Permissive 2.0. SPDX-listed,
  # OSI-approved, no copyleft. Pulled in by webpki-roots (transitive via
  # reqwest + tokio-tungstenite for the rustls-tls trust store).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
